<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Cẩm nang du lịch nước ngoài</title>
<!-- lookup-lean-instant-v7note -->
<style>body{margin:0;font:16px/1.4 -apple-system,sans-serif;color:#1c1917;background:#f6f4f1;padding:24px}.boot{color:#78716c}</style>
</head><body>
<p class="boot">Đang tải…</p>
<script>
(async function(){
  try {
    var files = ["p0.b64?v=v7note", "p1.b64?v=v7note", "p2.b64?v=v7note", "p3.b64?v=v7note", "p4.b64?v=v7note", "p5.b64?v=v7note", "p6.b64?v=v7note", "p7.b64?v=v7note", "p8.b64?v=v7note", "p9.b64?v=v7note", "p10.b64?v=v7note", "p11.b64?v=v7note", "p12.b64?v=v7note", "p13.b64?v=v7note", "p14.b64?v=v7note", "p15.b64?v=v7note", "p16.b64?v=v7note", "p17.b64?v=v7note"];
    var parts = await Promise.all(files.map(function(f){ return fetch(f).then(function(r){ if(!r.ok) throw new Error(f+" "+r.status); return r.text(); }); }));
    var b64 = parts.map(function(t){ return t.replace(/\s+/g,""); }).join("");
    var bin = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
    var stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
    var html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch (err) {
    document.body.textContent = "Không tải được trang: " + (err && err.message || err);
  }
})();
</script>
</body></html>
