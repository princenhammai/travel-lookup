<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mục lục du lịch nước ngoài</title>
<style>
  :root { --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --bg:#faf8f5; --accent:#0f766e; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header, .wrap, main { max-width: 880px; margin: 0 auto; }
  header { padding: 16px 16px 0; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.02em; }
  p.lead { margin: 0; color: var(--muted); font-size: 14px; }
  .bar { position: sticky; top: 0; z-index: 2; background: rgba(250,248,245,.94); backdrop-filter: blur(10px); padding: 10px 16px 8px; border-bottom: 1px solid transparent; }
  .wrap { min-width: 0; }
  input[type=search] { width: 100%; font: 16px/1.3 inherit; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: #fff; appearance: none; }
  input[type=search]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  #modes { display: flex; gap: 0; margin-top: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  #modes button { flex: 1 1 0; border: 0; border-radius: 0; min-height: 44px; padding: 10px 6px; font-size: 14px; }
  #modes button + button { border-left: 1px solid var(--line); }
  #modes button.on { background: var(--ink); color: #fff; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; margin: 8px -16px 0; padding: 2px 16px 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  button { font: 15px/1.2 inherit; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 10px 14px; min-height: 44px; cursor: pointer; flex: 0 0 auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  main { padding: 4px 16px calc(28px + env(safe-area-inset-bottom)); }
  .count { color: var(--muted); font-size: 14px; margin: 10px 0 8px; }
  a.card, .plain { position: relative; display: block; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 36px 14px 16px; margin: 0 0 8px; min-height: 56px; }
  a.card { text-decoration: none; color: inherit; }
  a.card:active { border-color: var(--accent); background: #f0fdfa; }
  a.card::after { content: "›"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 22px; line-height: 1; }
  .plain { padding-right: 16px; }
  .title { font-size: 16px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  h2.sec { font-size: 15px; margin: 16px 0 8px; font-weight: 650; }
  .note { display: none; }
  @media (min-width: 720px) {
    header { padding-top: 28px; }
    h1 { font-size: 28px; }
    p.lead { font-size: 16px; }
    .note { display: block; color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Du lịch nước ngoài</h1>
  <p class="lead">Gõ tên nước, visa, hoặc thành phố. Bài review mở tab mới; mục visa là danh sách tĩnh (không phụ thuộc Google Sheet).</p>
</header>
<div class="bar"><div class="wrap">
  <input id="q" type="search" placeholder="Ví dụ: Nhật, Schengen, Bali, Brunei…" enterkeyhint="search">
  <div class="chips" id="modes"></div>
  <div class="chips" id="sections"></div>
  <div class="chips" id="regions"></div>
</div></div>
<main>
  <p class="note">Dữ liệu snapshot 2026-10-05 từ Google Sheet mục lục review + miễn visa cho VN.</p>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
<script>
let REVIEWS = [];
let VISAS = [];
const modesBox = document.getElementById("modes");
const sectionsBox = document.getElementById("sections");
const regionsBox = document.getElementById("regions");
let mode = "Tất cả";
let sec = "Tất cả", reg = "Mọi châu lục";
const q = document.getElementById("q");
const SHORT = {
  "KINH NGHIỆM DU LỊCH": "Du lịch",
  "KINH NGHIỆM XIN VISA CÁC NƯỚC": "Xin visa",
  "ĐỊA DANH": "Địa danh"
};
function revealChip(el) {
  const b = el.querySelector(".on");
  if (!b) return;
  const er = el.getBoundingClientRect();
  const r = b.getBoundingClientRect();
  if (r.left < er.left + 8 || r.right > er.right - 24) {
    el.scrollLeft += (r.left + r.width / 2) - (er.left + er.width / 2);
  }
}
function showList() {
  const bar = document.querySelector(".bar");
  const list = document.getElementById("list");
  const top = bar.getBoundingClientRect().bottom + 8;
  window.scrollTo({ top: window.scrollY + list.getBoundingClientRect().top - top, behavior: "smooth" });
}
function chips(el, labels, current, set) {
  el.innerHTML = "";
  labels.forEach(label => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = SHORT[label] || label;
    b.className = label === current ? "on" : "";
    b.onclick = () => { set(label); render(); showList(); };
    el.appendChild(b);
  });
  revealChip(el);
}
function shortCat(c) {
  if (!c) return "";
  // Drop leading checkmark for chip labels
  return c.replace(/^✅\s*/, "").replace(/\s*✅\s*$/, "").trim();
}
function render() {
  const modes = ["Tất cả", "Bài review", "Miễn / xin Visa"];
  chips(modesBox, modes, mode, v => { mode = v; sec = "Tất cả"; reg = "Mọi châu lục"; });

  const reviewFiltered = sec !== "Tất cả" || reg !== "Mọi châu lục";
  const showReviews = mode === "Tất cả" || mode === "Bài review";
  const showVisas = mode === "Miễn / xin Visa" || (mode === "Tất cả" && !reviewFiltered && !q.value.trim());

  const sections = ["Tất cả", ...new Set(REVIEWS.map(x => x.section))];
  const regions = ["Mọi châu lục", ...new Set(REVIEWS.map(x => x.region).filter(Boolean))];
  const visaCats = ["Tất cả loại visa", ...new Set(VISAS.filter(x => x.kind === "country").map(x => shortCat(x.category)).filter(Boolean))];

  if (showReviews && !showVisas) {
    chips(sectionsBox, sections, sec, v => sec = v);
    chips(regionsBox, regions, reg, v => reg = v);
  } else if (showVisas && !showReviews) {
    chips(sectionsBox, visaCats, sec === "Tất cả" ? "Tất cả loại visa" : sec, v => sec = (v === "Tất cả loại visa" ? "Tất cả" : v));
    regionsBox.innerHTML = "";
  } else {
    chips(sectionsBox, sections, sec, v => sec = v);
    chips(regionsBox, regions, reg, v => reg = v);
  }

  const needle = q.value.trim().toLowerCase();
  const list = document.getElementById("list");
  list.innerHTML = "";
  let n = 0;

  if (showVisas) {
    const visaHit = VISAS.filter(x => {
      if (x.kind === "header") return !needle;
      if (mode === "Miễn / xin Visa" && sec !== "Tất cả" && sec !== "Tất cả loại visa" && shortCat(x.category) !== sec) return false;
      if (!needle) return x.kind !== "header" || true;
      const blob = (x.raw + " " + x.country + " " + x.notes + " " + x.category).toLowerCase();
      return blob.includes(needle);
    });
    const filtered = [];
    let lastHeader = null;
    visaHit.forEach(x => {
      if (x.kind === "header") { lastHeader = x; return; }
      if (needle && lastHeader) {
        if (!filtered.length || filtered[filtered.length - 1].category !== x.category) {
          if (shortCat(x.category)) {
            filtered.push({ kind: "header", category: x.category, country: "", notes: x.category, raw: x.category, url: "" });
          }
        }
        lastHeader = null;
      } else if (!needle && lastHeader) {
        filtered.push(lastHeader);
        lastHeader = null;
      }
      filtered.push(x);
    });

    if (filtered.some(x => x.kind !== "header")) {
      const h = document.createElement("h2");
      h.className = "sec";
      h.textContent = "Các nước miễn / xin Visa cho VN";
      list.appendChild(h);
    }
    filtered.forEach(x => {
      if (x.kind === "header") {
        const h = document.createElement("h2");
        h.className = "sec";
        h.textContent = x.raw || x.category;
        list.appendChild(h);
        return;
      }
      n++;
      const title = x.country ? x.country : (x.raw || x.notes);
      const meta = [shortCat(x.category), x.notes].filter(Boolean).join(" · ");
      if (x.url) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = x.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.innerHTML = '<div class="title"></div><div class="meta"></div>';
        a.querySelector(".title").textContent = title;
        a.querySelector(".meta").textContent = meta;
        list.appendChild(a);
      } else {
        const d = document.createElement("div");
        d.className = "plain";
        d.innerHTML = '<div class="title"></div><div class="meta"></div>';
        d.querySelector(".title").textContent = (x.raw.startsWith("📌") ? x.raw : title);
        d.querySelector(".meta").textContent = x.country ? shortCat(x.category) : meta;
        if (x.kind === "country") {
          d.querySelector(".title").textContent = x.raw;
          d.querySelector(".meta").textContent = shortCat(x.category);
        }
        list.appendChild(d);
      }
    });
  }

  if (showReviews) {
    const hit = REVIEWS.filter(x => {
      if (sec !== "Tất cả" && sec !== "Tất cả loại visa" && x.section !== sec) return false;
      if (reg !== "Mọi châu lục" && x.region !== reg) return false;
      if (!needle) return true;
      return (x.title + " " + x.region + " " + x.author + " " + x.section).toLowerCase().includes(needle);
    });
    if (hit.length) {
      const h = document.createElement("h2");
      h.className = "sec";
      h.textContent = "Bài review / kinh nghiệm";
      list.appendChild(h);
    }
    hit.forEach(x => {
      n++;
      const a = document.createElement("a");
      a.className = "card";
      a.href = x.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = '<div class="title"></div><div class="meta"></div>';
      a.querySelector(".title").textContent = x.title;
      a.querySelector(".meta").textContent = [x.section, x.region, x.author].filter(Boolean).join(" · ");
      list.appendChild(a);
    });
  }

  const bits = [];
  if (mode !== "Tất cả") bits.push(mode);
  if (sec !== "Tất cả" && sec !== "Tất cả loại visa") bits.push(SHORT[sec] || sec);
  if (reg !== "Mọi châu lục") bits.push(reg);
  if (needle) bits.push(q.value.trim());
  document.getElementById("count").textContent = n + " mục" + (bits.length ? " · " + bits.join(" · ") : "");
}
q.addEventListener("input", render);
const reviewParts=["data/reviews-01.json","data/reviews-02.json","data/reviews-03.json","data/reviews-04.json","data/reviews-05.json","data/reviews-06.json","data/reviews-07.json","data/reviews-08.json"];
const visaParts=["data/visas-01.json","data/visas-02.json","data/visas-03.json","data/visas-04.json"];
function loadPart(u){
  return fetch(u).then(r => { if(!r.ok) throw new Error(u+" "+r.status); return r.text(); }).then(t => {
    try { return JSON.parse(t); }
    catch(e) { return JSON.parse(t.replace(/}\s*$/, "")); }
  });
}
Promise.all([...reviewParts, ...visaParts].map(loadPart)).then(parts => {
  REVIEWS = parts.slice(0, reviewParts.length).flat();
  VISAS = parts.slice(reviewParts.length).flat();
  render();
}).catch(err => {
  document.getElementById("count").textContent = "Không tải được dữ liệu: " + err.message;
});
</script>
</body>
</html>
