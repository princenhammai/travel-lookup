<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mục lục du lịch nước ngoài</title>
<!-- lookup-search-classify -->
<style>
  :root { --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --bg:#f6f4f1; --accent:#0f766e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; min-width: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; overflow: hidden; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  .app { height: 100dvh; max-width: 720px; min-width: 0; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  header { flex: none; min-width: 0; padding: calc(10px + env(safe-area-inset-top)) 16px 0; }
  h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
  p.lead { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .bar { flex: none; min-width: 0; padding: 10px 16px 6px; background: var(--bg); overflow: visible; }
  .wrap { min-width: 0; }
  .find { min-width: 0; position: relative; }
  .search { display: flex; align-items: center; gap: 2px; min-width: 0; width: 100%; background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); padding: 0 2px 0 12px; }
  .search:focus-within { box-shadow: 0 0 0 2px var(--accent); }
  .search .ico { flex: none; width: 20px; height: 20px; color: var(--muted); display: block; }
  .search input { flex: 1 1 0%; width: 100%; min-width: 0; max-width: 100%; border: 0; margin: 0; padding: 12px 4px; background: transparent; font: 16px/1.3 inherit; color: inherit; box-shadow: none; appearance: none; -webkit-appearance: none; border-radius: 0; }
  .search input:focus { outline: none; }
  .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
  #clear { flex: 0 0 44px; width: 44px; height: 44px; min-width: 44px; min-height: 44px; margin: 0; padding: 0; border-radius: 12px; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; }
  #clear[hidden] { display: none !important; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; min-width: 0; max-width: 100%; }
  .suggest:empty { display: none; }
  .suggest button { flex: 0 1 auto; max-width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; width: 100%; min-width: 0; max-width: 100%; margin: 8px 0 0; padding: 2px 0 8px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; overscroll-behavior-x: contain; }
  .chips::-webkit-scrollbar { display: none; }
  .chips:empty { display: none; }
  button { font: 15px/1.2 inherit; border: 0; background: #fff; color: var(--ink); border-radius: 999px; padding: 10px 14px; min-height: 44px; white-space: nowrap; cursor: pointer; flex: 0 0 auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .chips button.on { background: var(--ink); color: #fff; }
  main { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px calc(20px + env(safe-area-inset-bottom)); }
  .count { color: var(--muted); font-size: 13px; margin: 4px 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { display: none; }
  a.card, .plain { position: relative; display: block; max-width: 100%; background: #fff; border-radius: 16px; padding: 14px 36px 14px 14px; margin: 0 0 8px; min-height: 56px; }
  a.card { text-decoration: none; color: inherit; }
  a.card:active { background: #f0fdfa; }
  a.card::after { content: "›"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #a8a29e; font-size: 22px; }
  .plain { padding-right: 14px; }
  .title, .meta, h1, h2, p { overflow-wrap: anywhere; }
  .when { white-space: nowrap; }
  .title { font-size: 16px; font-weight: 650; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  h2.sec { font-size: 13px; letter-spacing: .02em; text-transform: none; color: var(--muted); margin: 14px 0 8px; font-weight: 650; }
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Du lịch nước ngoài</h1>
  <p class="lead">Gõ tên nước, visa, hoặc thành phố. Bài review mở tab mới; mục visa là danh sách tĩnh (không phụ thuộc Google Sheet).</p>
</header>
<div class="bar"><div class="wrap">
  <div class="find">
    <div class="search">
      <svg class="ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
      <input id="q" type="search" placeholder="Tìm nước, thành phố, visa" enterkeyhint="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="button" id="clear" aria-label="Xóa tìm kiếm" hidden>×</button>
    </div>
    <div id="suggest" class="suggest"></div>
  </div>
  <div class="chips" id="types"></div>
  <div class="chips" id="regions"></div>
  <div class="chips" id="countries"></div>
</div></div>
<main>
  <p class="note">Dữ liệu snapshot 2026-10-05 từ Google Sheet mục lục review + miễn visa cho VN.</p>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
<script>
let REVIEWS = [];
let VISAS = [];
const typesBox = document.getElementById("types");
const regionsBox = document.getElementById("regions");
const countriesBox = document.getElementById("countries");
const suggestBox = document.getElementById("suggest");
const clearBtn = document.getElementById("clear");
let type = "Tất cả";
let cont = "Tất cả";
const q = document.getElementById("q");
/*@logic*/
const TYPE_SECTION = {
  "Kinh nghiệm": "KINH NGHIỆM DU LỊCH",
  "Xin visa": "KINH NGHIỆM XIN VISA CÁC NƯỚC",
  "Địa danh": "ĐỊA DANH"
};
const CONT_REGION = {
  "Á": "CHÂU Á",
  "Đông Nam Á": "ĐÔNG NAM Á",
  "Âu": "CHÂU ÂU",
  "Bắc Mỹ": "BẮC MỸ",
  "Nam Mỹ": "NAM MỸ",
  "Phi": "CHÂU PHI",
  "Úc": "CHÂU ÚC",
  "Chung": "ALL"
};
const GROUP_ORDER = [
  ["KINH NGHIỆM DU LỊCH", "Kinh nghiệm"],
  ["KINH NGHIỆM XIN VISA CÁC NƯỚC", "Xin visa"],
  ["ĐỊA DANH", "Địa danh"]
];
const COUNTRY_HINTS = ["Thái Lan","Nhật Bản","Hàn Quốc","Myanmar","Đài Loan","Maldives","Indonesia","Malaysia","Philippines","Nga","Canada","Peru","Trung Quốc","Hongkong","Lào","Úc"];
function fold(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
}
function queryWords(raw) {
  return fold(raw).split(/\s+/).filter(Boolean);
}
function textHits(blob, words, tokenText) {
  if (!words.length) return true;
  const f = fold(blob);
  const tokens = new Set(fold(tokenText == null ? blob : tokenText).split(/[^a-z0-9]+/).filter(Boolean));
  return words.every(w => w.length <= 2 ? tokens.has(w) : f.includes(w));
}
function regionOk(item, cont) {
  if (cont === "Tất cả") return true;
  const americasVisa = (cont === "Bắc Mỹ" || cont === "Nam Mỹ") && item.region === "CHÂU MỸ" && item.section === "KINH NGHIỆM XIN VISA CÁC NƯỚC";
  return item.region === CONT_REGION[cont] || americasVisa;
}
function reviewMatch(x, type, cont, words) {
  if (type === "Miễn visa") return false;
  if (type !== "Tất cả" && x.section !== TYPE_SECTION[type]) return false;
  if (!regionOk(x, cont)) return false;
  if (!words.length) return true;
  return textHits([x.title, x.region, x.author, x.section].join(" "), words, [x.title, x.region, x.section].join(" "));
}
function wantsVisas(type, cont, rawQuery) {
  const words = queryWords(rawQuery);
  return type === "Miễn visa" || (type === "Tất cả" && cont === "Tất cả" && words.length === 0);
}
function hasCountry(text, name) {
  const n = fold(name).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return new RegExp("(^|[^a-z0-9])" + n + "([^a-z0-9]|$)").test(fold(text));
}
function countryShortcuts(reviews) {
  const names = [];
  for (const name of COUNTRY_HINTS) {
    if (reviews.some(x => hasCountry(x.title, name) || hasCountry(x.region, name))) names.push(name);
    if (names.length === 12) break;
  }
  return names;
}
function postIdOf(url) {
  const seg = String(url || "").split(/[?#]/)[0].split("/").filter(Boolean).pop() || "";
  return /^\d+$/.test(seg) ? seg : "";
}
function reviewTs(x) {
  const id = postIdOf(x.url);
  if (!id) return null;
  return Number(BigInt(id) >> 22n) + 1293840000;
}
function byNewest(a, b) {
  const ta = reviewTs(a), tb = reviewTs(b);
  if (ta == null && tb == null) return 0;
  if (ta == null) return 1;
  if (tb == null) return -1;
  return tb - ta;
}
/*@logic-end*/
function revealChip(el) {
  const b = el.querySelector(".on");
  if (!b) return;
  const er = el.getBoundingClientRect();
  const r = b.getBoundingClientRect();
  if (r.left < er.left + 8 || r.right > er.right - 24) {
    el.scrollLeft += (r.left + r.width / 2) - (er.left + er.width / 2);
  }
}
function showList() {
  document.querySelector("main").scrollTo({ top: 0, behavior: "smooth" });
}
function chips(el, labels, current, set, clearTo) {
  el.innerHTML = "";
  labels.forEach(label => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.className = label === current ? "on" : "";
    b.onclick = () => {
      if (clearTo !== undefined && label === current) set(clearTo);
      else set(label);
      suggestBox.innerHTML = "";
      render();
      showList();
    };
    el.appendChild(b);
  });
  revealChip(el);
}
function shortCat(c) {
  if (!c) return "";
  return c.replace(/^\u2705\s*/, "").replace(/\s*\u2705\s*$/, "").trim();
}
function fmtDate(ts) {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Saigon",
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  }).formatToParts(new Date(ts * 1000));
  const g = type => parts.find(p => p.type === type).value;
  return g("day") + "." + g("month") + "." + g("year");
}
function fillMeta(el, dateText, rest) {
  el.textContent = "";
  if (dateText) {
    const s = document.createElement("span");
    s.className = "when";
    s.textContent = dateText;
    el.appendChild(s);
  }
  if (rest) el.appendChild(document.createTextNode((dateText ? " · " : "") + rest));
}
function appendReview(x) {
  const a = document.createElement("a");
  a.className = "card";
  a.href = x.url;
  a.target = "_blank";
  a.rel = "noopener";
  a.innerHTML = '<div class="title"></div><div class="meta"></div>';
  a.querySelector(".title").textContent = x.title;
  const ts = reviewTs(x);
  fillMeta(a.querySelector(".meta"), ts == null ? "" : fmtDate(ts), [x.region, x.author].filter(Boolean).join(" · "));
  document.getElementById("list").appendChild(a);
}
function suggestionLabels(words) {
  const seen = new Set();
  const out = [];
  function add(label) {
    const t = String(label || "").trim();
    if (!t || !textHits(t, words, t)) return;
    const key = fold(t);
    if (seen.has(key)) return;
    seen.add(key);
    out.push(t);
  }
  VISAS.forEach(x => { if (x.kind === "country") add(x.country); });
  REVIEWS.slice().sort(byNewest).forEach(x => add(x.title));
  return out.slice(0, 6);
}
function renderSuggest() {
  const words = queryWords(q.value);
  if (!words.length) {
    suggestBox.innerHTML = "";
    return;
  }
  if (document.activeElement !== q) return;
  suggestBox.innerHTML = "";
  suggestionLabels(words).forEach(label => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    suggestBox.appendChild(b);
  });
}
function applySuggestion(text) {
  q.value = text;
  q.focus();
  render();
  showList();
}
function paintCountries() {
  const prev = countriesBox.scrollLeft;
  const names = countryShortcuts(REVIEWS);
  const current = fold(q.value.trim());
  countriesBox.innerHTML = "";
  names.forEach(name => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = name;
    if (current && current === fold(name)) b.className = "on";
    b.onclick = () => {
      q.value = name;
      suggestBox.innerHTML = "";
      render();
      showList();
    };
    countriesBox.appendChild(b);
  });
  countriesBox.scrollLeft = prev;
  if (countriesBox.querySelector(".on")) revealChip(countriesBox);
}
function resultLine(reviewN, visaN, rawQ) {
  let core;
  if (type !== "Miễn visa" && wantsVisas(type, cont, rawQ)) core = reviewN + " bài · " + visaN + " nước";
  else if (type === "Miễn visa") core = visaN + " nước";
  else core = reviewN + " bài";
  const bits = [];
  if (type !== "Tất cả") bits.push(type);
  if (type !== "Miễn visa" && cont !== "Tất cả") bits.push(cont);
  if (rawQ) bits.push(rawQ);
  return bits.length ? core + " · " + bits.join(" · ") : core;
}
function render() {
  const rawQ = q.value.trim();
  const words = queryWords(rawQ);
  clearBtn.hidden = q.value.length === 0;
  const typeLabels = ["Tất cả", "Kinh nghiệm", "Xin visa", "Địa danh", "Miễn visa"];
  chips(typesBox, typeLabels, type, v => { type = v; }, "Tất cả");
  const contLabels = ["Tất cả", "Á", "Đông Nam Á", "Âu", "Bắc Mỹ", "Nam Mỹ", "Phi", "Úc"];
  if (REVIEWS.some(x => x.region === "ALL")) contLabels.push("Chung");
  chips(regionsBox, contLabels, cont, v => { cont = v; }, "Tất cả");
  paintCountries();
  renderSuggest();

  const showReviews = type !== "Miễn visa";
  const showVisas = wantsVisas(type, cont, rawQ);
  const list = document.getElementById("list");
  list.innerHTML = "";
  let reviewN = 0;
  let visaN = 0;

  if (showReviews) {
    const hit = REVIEWS.filter(x => reviewMatch(x, type, cont, words));
    if (type === "Tất cả") {
      GROUP_ORDER.forEach(([section, label]) => {
        const group = hit.filter(x => x.section === section).sort(byNewest);
        if (!group.length) return;
        const h = document.createElement("h2");
        h.className = "sec";
        h.textContent = label;
        list.appendChild(h);
        group.forEach(x => { reviewN++; appendReview(x); });
      });
    } else {
      hit.sort(byNewest);
      hit.forEach(x => { reviewN++; appendReview(x); });
    }
  }

  if (showVisas) {
    const visaHit = VISAS.filter(x => {
      if (x.kind === "header") return !words.length;
      if (!words.length) return true;
      return textHits([x.raw, x.country, x.notes, x.category].join(" "), words, [x.country, x.raw].join(" "));
    });
    const filtered = [];
    let lastHeader = null;
    visaHit.forEach(x => {
      if (x.kind === "header") { lastHeader = x; return; }
      if (words.length && lastHeader) {
        if (!filtered.length || filtered[filtered.length - 1].category !== x.category) {
          if (shortCat(x.category)) {
            filtered.push({ kind: "header", category: x.category, country: "", notes: x.category, raw: x.category, url: "" });
          }
        }
        lastHeader = null;
      } else if (!words.length && lastHeader) {
        filtered.push(lastHeader);
        lastHeader = null;
      }
      filtered.push(x);
    });
    if (filtered.some(x => x.kind !== "header")) {
      const h = document.createElement("h2");
      h.className = "sec";
      h.textContent = "Miễn visa";
      list.appendChild(h);
    }
    filtered.forEach(x => {
      if (x.kind === "header") {
        const h = document.createElement("h2");
        h.className = "sec";
        h.textContent = x.raw || x.category;
        list.appendChild(h);
        return;
      }
      if (x.kind === "country") visaN++;
      const title = x.country ? x.country : (x.raw || x.notes);
      const meta = [shortCat(x.category), x.notes].filter(Boolean).join(" · ");
      if (x.url) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = x.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.innerHTML = '<div class="title"></div><div class="meta"></div>';
        a.querySelector(".title").textContent = title;
        a.querySelector(".meta").textContent = meta;
        list.appendChild(a);
      } else {
        const d = document.createElement("div");
        d.className = "plain";
        d.innerHTML = '<div class="title"></div><div class="meta"></div>';
        d.querySelector(".title").textContent = (x.raw.startsWith("\ud83d\udccc") ? x.raw : title);
        d.querySelector(".meta").textContent = x.country ? shortCat(x.category) : meta;
        if (x.kind === "country") {
          d.querySelector(".title").textContent = x.raw;
          d.querySelector(".meta").textContent = shortCat(x.category);
        }
        list.appendChild(d);
      }
    });
  }

  document.getElementById("count").textContent = resultLine(reviewN, visaN, rawQ);
}
q.addEventListener("input", render);
clearBtn.addEventListener("click", () => {
  q.value = "";
  suggestBox.innerHTML = "";
  q.focus();
  render();
  showList();
});
let hideTimer = 0;
q.addEventListener("focus", () => renderSuggest());
q.addEventListener("blur", () => {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (document.activeElement !== q) suggestBox.innerHTML = "";
  }, 280);
});
suggestBox.addEventListener("pointerdown", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  e.preventDefault();
  applySuggestion(btn.textContent);
});
suggestBox.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const btn = e.target.closest("button");
  if (!btn) return;
  e.preventDefault();
  applySuggestion(btn.textContent);
});
const reviewParts=["data/reviews-01.json","data/reviews-02.json","data/reviews-03.json","data/reviews-04.json","data/reviews-05.json","data/reviews-06.json","data/reviews-07.json","data/reviews-08.json"];
const visaParts=["data/visas-01.json","data/visas-02.json","data/visas-03.json","data/visas-04.json"];
function loadPart(u){
  return fetch(u).then(r => { if(!r.ok) throw new Error(u+" "+r.status); return r.text(); }).then(t => {
    try { return JSON.parse(t); }
    catch(e) { return JSON.parse(t.replace(/}\s*$/, "")); }
  });
}
Promise.all([...reviewParts, ...visaParts].map(loadPart)).then(parts => {
  REVIEWS = parts.slice(0, reviewParts.length).flat();
  VISAS = parts.slice(reviewParts.length).flat();
  render();
}).catch(err => {
  document.getElementById("count").textContent = "Không tải được dữ liệu: " + err.message;
});
</script>
</div>
</body>
</html>
