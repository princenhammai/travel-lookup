<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mục lục du lịch nước ngoài</title>
<style>
  :root { --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --bg:#faf8f5; --card:#fff; --accent:#0f766e; }
  * { box-sizing: border-box; }
  body { margin:0; font: 16px/1.45 Palatino, Georgia, serif; color:var(--ink); background:var(--bg); }
  header { padding: 28px 20px 8px; max-width: 880px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; }
  p.lead { margin: 0; color: var(--muted); }
  .bar { position: sticky; top: 0; background: rgba(250,248,245,.92); backdrop-filter: blur(8px); padding: 14px 20px 10px; }
  .wrap, main { max-width: 880px; margin: 0 auto; }
  input[type=search] { width: 100%; font: 18px/1.3 inherit; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button { font: 14px/1 inherit; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  main { padding: 8px 20px 48px; }
  .count { color: var(--muted); font-size: 14px; margin: 8px 0 12px; }
  a.card { display: block; text-decoration: none; color: inherit; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; }
  a.card:hover { border-color: var(--accent); }
  .title { font-size: 17px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Du lịch nước ngoài</h1>
  <p class="lead">Gõ tên nước, visa, hoặc thành phố. Bấm một bài để mở bài viết gốc.</p>
</header>
<div class="bar"><div class="wrap">
  <input id="q" type="search" placeholder="Ví dụ: Nhật, Schengen, Bali, passport…" autofocus>
  <div class="chips" id="sections"></div>
  <div class="chips" id="regions"></div>
</div></div>
<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
<script>
let ITEMS = [];
const sectionsBox = document.getElementById("sections");
const regionsBox = document.getElementById("regions");
let sec = "Tất cả", reg = "Mọi châu lục";
const q = document.getElementById("q");
function chips(el, labels, current, set) {
  el.innerHTML = "";
  labels.forEach(label => {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = label === current ? "on" : "";
    b.onclick = () => { set(label); render(); };
    el.appendChild(b);
  });
}
function render() {
  const sections = ["Tất cả", ...new Set(ITEMS.map(x => x.section))];
  const regions = ["Mọi châu lục", ...new Set(ITEMS.map(x => x.region).filter(Boolean))];
  chips(sectionsBox, sections, sec, v => sec = v);
  chips(regionsBox, regions, reg, v => reg = v);
  const needle = q.value.trim().toLowerCase();
  const hit = ITEMS.filter(x => {
    if (sec !== "Tất cả" && x.section !== sec) return false;
    if (reg !== "Mọi châu lục" && x.region !== reg) return false;
    if (!needle) return true;
    return (x.title + " " + x.region + " " + x.author + " " + x.section).toLowerCase().includes(needle);
  });
  document.getElementById("count").textContent = hit.length + " bài";
  const list = document.getElementById("list");
  list.innerHTML = "";
  hit.forEach(x => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = x.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = '<div class="title"></div><div class="meta"></div>';
    a.querySelector(".title").textContent = x.title;
    a.querySelector(".meta").textContent = [x.section, x.region, x.author].filter(Boolean).join(" · ");
    list.appendChild(a);
  });
}
q.addEventListener("input", render);
fetch("travel-data.json").then(r => r.json()).then(data => { ITEMS = data; render(); });
</script>
</body>
</html>
