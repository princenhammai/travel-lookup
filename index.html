<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mục lục du lịch nước ngoài</title>
<!-- lookup-search-classify-v3 -->
<style>body{margin:0;font:16px/1.4 -apple-system,sans-serif;color:#1c1917;background:#f6f4f1;padding:24px}.boot{color:#78716c}</style>
</head><body>
<p class="boot">Đang tải…</p>
<script>
(async function(){
  try {
    var files = ["p00.b64", "p01.b64", "p02.b64", "p03.b64", "p04.b64", "p05.b64", "p06.b64", "p07.b64", "p08.b64", "p09.b64", "p10.b64", "p11.b64", "p12.b64", "p13.b64", "p14.b64", "p15.b64"];
    var parts = await Promise.all(files.map(function(f){ return fetch(f).then(function(r){ if(!r.ok) throw new Error(f+" "+r.status); return r.text(); }); }));
    var bin = parts.map(function(t){
      t = t.replace(/\s+/g,"");
      var s = atob(t);
      var u = new Uint8Array(s.length);
      for (var i=0;i<s.length;i++) u[i]=s.charCodeAt(i);
      return u;
    });
    var total = bin.reduce(function(n,u){ return n+u.length; }, 0);
    var out = new Uint8Array(total), o=0;
    bin.forEach(function(u){ out.set(u,o); o+=u.length; });
    var html = new TextDecoder("utf-8").decode(out);
    document.open(); document.write(html); document.close();
  } catch(err) {
    document.body.textContent = "Không tải được trang: " + (err && err.message || err);
  }
})();
</script>
</body></html>
