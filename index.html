<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mục lục du lịch nước ngoài</title>
<!-- lookup-search-classify-v3 -->
<style>body{margin:0;font:16px/1.4 -apple-system,sans-serif;color:#1c1917;background:#f6f4f1;padding:24px}.boot{color:#78716c}</style>
</head><body>
<p class="boot">Đang tải…</p>
<script>
(async function(){
  try {
    var files = ['part-00.txt', 'part-01.txt', 'part-02.txt', 'part-03.txt', 'part-04.txt', 'part-05.txt', 'part-06.txt', 'part-07.txt', 'part-08.txt', 'part-09.txt', 'part-10.txt'];
    var parts = await Promise.all(files.map(function(f){ return fetch(f).then(function(r){ if(!r.ok) throw new Error(f+" "+r.status); return r.text(); }); }));
    var html = parts.join("");
    document.open(); document.write(html); document.close();
  } catch(err) {
    document.body.textContent = "Không tải được trang: " + (err && err.message || err);
  }
})();
</script>
</body></html>
